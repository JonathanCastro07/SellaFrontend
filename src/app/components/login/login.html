
<div class="contenedor">
  <h2>{{ modoRegistro() ? 'Crear cuenta' : 'Iniciar sesión' }}</h2>

  @if (errorMensaje()) {
    <p class="error">{{ errorMensaje() }}</p>
  }

  @if (!modoRegistro()) {
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <input type="email" formControlName="email" placeholder="Email" />
      <input type="password" formControlName="password" placeholder="Contraseña" />
      <button type="submit" [disabled]="loginForm.invalid || cargando()">
        {{ cargando() ? 'Cargando...' : 'Entrar' }}
      </button>
    </form>
  } @else {
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <input type="text" formControlName="nombre" placeholder="Nombre" />
      <input type="email" formControlName="email" placeholder="Email" />
      <input type="password" formControlName="password" placeholder="Contraseña (mín. 6 caracteres)" />
      <button type="submit" [disabled]="registerForm.invalid || cargando()">
        {{ cargando() ? 'Cargando...' : 'Registrarme' }}
      </button>
    </form>
  }

  <button class="toggle" (click)="toggleModo()">
    {{ modoRegistro() ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate' }}
  </button>
</div>
